<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="title desc">
  <title id="title">ChangeSafe</title>
  <desc id="desc">A bright point held safely at the center of a polished dark field.</desc>
  <defs>
    <linearGradient id="surface" x1="4" y1="2" x2="28" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20302f"/>
      <stop offset="0.42" stop-color="#091311"/>
      <stop offset="1" stop-color="#020605"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(9 5) rotate(46) scale(24)">
      <stop stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.48" stop-color="#a8c7eb" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="dot-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#surface)"/>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#sheen)" stroke="#ffffff" stroke-opacity="0.08"/>
  <circle cx="16" cy="16" r="3" fill="#ffffff" filter="url(#dot-glow)"/>
</svg>
