<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B0E14">
<title>BlueTerm</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
  :root{
    --bg:#0B0E14; --panel:#11151F; --line:#1E2430;
    --fg:#C8CED9; --dim:#5C6773; --amber:#FFB454; --amber-soft:#3A2E1A;
    --ok:#7FD962; --err:#F26D78; --user:#73B8FF;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:var(--mono); font-size:13.5px; line-height:1.55;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  header{
    flex:none; display:flex; align-items:center; gap:9px;
    padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
  .dot.off{background:var(--err)}
  .brand{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--amber)}
  .hstat{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .hstat b{color:var(--fg);font-weight:500}
  .hbtn{background:none;border:1px solid var(--line);color:var(--amber);font:inherit;font-size:11px;
    padding:4px 8px;border-radius:4px;white-space:nowrap;cursor:pointer}
  #modelBtn{max-width:34vw;overflow:hidden;text-overflow:ellipsis}
  #chatsBtn{color:var(--fg);font-size:13px;line-height:1;padding:4px 9px}
  button:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
  main{flex:1;overflow-y:auto;padding:14px 14px 8px;-webkit-overflow-scrolling:touch}
  .msg{margin:0 0 14px;white-space:pre-wrap;word-break:break-word}
  .msg .p{user-select:none}
  .u .p{color:var(--user);font-weight:700}
  .a .p{color:var(--amber);font-weight:700}
  .sys{color:var(--dim)}
  .errm{color:var(--err)}
  .cursor{display:inline-block;width:7px;height:14px;background:var(--amber);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.cursor{animation:none}}
  footer{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
  .row{display:flex;gap:8px;align-items:flex-end}
  .ps1{color:var(--amber);font-weight:700;padding:8px 0;flex:none}
  textarea{
    flex:1;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;
    font:inherit;padding:8px 10px;resize:none;min-height:38px;max-height:120px}
  #send{background:var(--amber);color:#0B0E14;border:0;border-radius:6px;font:inherit;font-weight:700;
    padding:8px 14px;flex:none;cursor:pointer}
  #send:disabled{background:var(--amber-soft);color:var(--dim)}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;
    font-family:var(--mono);max-width:min(94vw,440px);width:100%;padding:0;max-height:76dvh}
  dialog::backdrop{background:rgba(0,0,0,.65)}
  dialog h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);margin:0;
    padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
    position:sticky;top:0;background:var(--panel);z-index:1}
  dialog h2 .sp{margin-left:auto}
  .dlgbody{overflow-y:auto;max-height:calc(76dvh - 46px)}
  .mrow{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
    color:var(--fg);font:inherit;font-size:12.5px;padding:11px 14px;cursor:pointer}
  .mrow.sel{color:var(--amber);background:var(--amber-soft)}
  .crow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:0 6px 0 0}
  .crow.sel{background:var(--amber-soft)}
  .crow .open{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;font-size:12.5px;
    text-align:left;padding:11px 14px;cursor:pointer}
  .crow.sel .open{color:var(--amber)}
  .crow .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow .when{display:block;font-size:10.5px;color:var(--dim);margin-top:3px}
  .del{background:none;border:0;color:var(--dim);font:inherit;font-size:15px;padding:10px;cursor:pointer;flex:none}
  .del:hover,.del:focus-visible{color:var(--err)}
  .empty{padding:16px 14px;color:var(--dim);font-size:12px}
</style>

<header>
  <span class="dot off" id="dot"></span>
  <span class="brand">blueterm</span><span id="ver" style="font-size:10px;color:var(--dim)">v3</span>
  <div class="hstat">
    <button id="chatsBtn" class="hbtn" type="button" title="saved chats" aria-label="saved chats">&#9776;</button>
    <button id="modelBtn" class="hbtn" type="button">model&#8230;</button>
    <span id="spend">$ --</span>
  </div>
</header>
<main id="log" aria-live="polite"></main>
<footer>
  <div class="row">
    <span class="ps1">&#10095;</span>
    <textarea id="in" rows="1" placeholder="message or /help" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"></textarea>
    <button id="send" type="button">run</button>
  </div>
</footer>

<dialog id="modelDlg"><h2>select model</h2><div class="dlgbody" id="modelList"></div></dialog>
<dialog id="chatDlg">
  <h2>saved chats <span class="sp"></span><button id="newBtn" class="hbtn" type="button">+ new</button></h2>
  <div class="dlgbody" id="chatList"></div>
</dialog>

<script>
const API='https://api.bluesminds.com/v1';
const $=id=>document.getElementById(id);
const log=$('log'), input=$('in'), sendBtn=$('send');
const modelDlg=$('modelDlg'), chatDlg=$('chatDlg');
const MAX_CHATS=60;
let key=null, model='gpt-4o', busy=false, models=[];
let chats=[], curId=null;

/* ---------- storage (this browser only; never leaves the device) ---------- */
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null} }
function loadState(){
  key=ls('bm_key'); model=ls('bm_model')||'gpt-4o';
  try{ chats=JSON.parse(ls('bm_chats')||'[]'); }catch(e){ chats=[]; }
  if(!Array.isArray(chats)) chats=[];
  curId=ls('bm_cur');
  if(!chats.some(c=>c.id===curId)) curId=chats.length?chats[0].id:null;
}
function persist(){
  try{
    chats=chats.slice(0,MAX_CHATS);
    localStorage.setItem('bm_chats',JSON.stringify(chats));
    if(curId) localStorage.setItem('bm_cur',curId);
  }catch(e){
    // storage full: drop the oldest chats and try once more
    chats=chats.slice(0,Math.max(1,Math.floor(chats.length/2)));
    try{localStorage.setItem('bm_chats',JSON.stringify(chats))}catch(e2){err('could not save chat: phone storage is full. delete some chats.')}
  }
}
const cur=()=>chats.find(c=>c.id===curId);
function newChat(quiet){
  const c={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:'new chat',model,messages:[],updated:Date.now()};
  chats.unshift(c); curId=c.id; persist(); log.innerHTML='';
  if(!quiet) sys('new chat started.');
  return c;
}
function touch(){
  const c=cur(); if(!c)return;
  c.updated=Date.now(); c.model=model;
  if(!c.messages.length) c.title='new chat';
  if((!c.title||c.title==='new chat')&&c.messages.length){
    const first=c.messages.find(m=>m.role==='user');
    if(first) c.title=first.content.replace(/\s+/g,' ').trim().slice(0,44)||'new chat';
  }
  chats.sort((a,b)=>b.updated-a.updated);
  persist();
}

/* ---------- rendering ---------- */
function line(cls,prefix,text){
  const d=document.createElement('div'); d.className='msg '+cls;
  if(prefix){const p=document.createElement('span');p.className='p';p.textContent=prefix+' ';d.appendChild(p);}
  d.appendChild(document.createTextNode(text||''));
  log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}
const sys=t=>line('sys','·',t), err=t=>line('errm','!',t);
function renderChat(){
  log.innerHTML='';
  const c=cur(); if(!c){return}
  for(const m of c.messages) line(m.role==='user'?'u':'a', m.role==='user'?'❯':'ai>', m.content);
  log.scrollTop=log.scrollHeight;
}
function ago(ts){
  const s=(Date.now()-ts)/1000;
  if(s<60)return'just now'; if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<604800)return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
}

/* ---------- chat list dialog ---------- */
function renderChatList(){
  const list=$('chatList'); list.innerHTML='';
  if(!chats.length){ list.innerHTML='<p class="empty">no saved chats yet. anything you type is saved here automatically.</p>'; return; }
  for(const c of chats){
    const row=document.createElement('div'); row.className='crow'+(c.id===curId?' sel':'');
    const open=document.createElement('button'); open.type='button'; open.className='open';
    const t=document.createElement('span'); t.className='t'; t.textContent=c.title||'new chat';
    const w=document.createElement('span'); w.className='when';
    w.textContent=ago(c.updated)+' · '+c.messages.filter(m=>m.role==='user').length+' msg · '+(c.model||model);
    open.append(t,w);
    open.onclick=()=>{ curId=c.id; if(c.model){model=c.model; $('modelBtn').textContent=model; ls('bm_model',model);} persist(); renderChat(); chatDlg.close(); };
    const del=document.createElement('button'); del.type='button'; del.className='del'; del.title='delete'; del.setAttribute('aria-label','delete chat'); del.textContent='×';
    del.onclick=()=>{
      chats=chats.filter(x=>x.id!==c.id);
      if(curId===c.id){ curId=chats.length?chats[0].id:null; if(!curId) newChat(true); renderChat(); }
      persist(); renderChatList();
    };
    row.append(open,del); list.appendChild(row);
  }
}
$('chatsBtn').onclick=()=>{ renderChatList(); chatDlg.showModal(); };
$('newBtn').onclick=()=>{ newChat(); chatDlg.close(); };
chatDlg.onclick=e=>{if(e.target===chatDlg)chatDlg.close()};
modelDlg.onclick=e=>{if(e.target===modelDlg)modelDlg.close()};

/* ---------- api ---------- */
async function api(path,opts={}){
  const r=await fetch(API+path,{...opts,headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json',...(opts.headers||{})}});
  if(!r.ok){let t='';try{t=(await r.text()).slice(0,300)}catch(e){} throw new Error(r.status+' '+t);}
  return r;
}
async function refreshSpend(){
  try{const d=await (await api('/dashboard/billing/usage')).json();
    $('spend').innerHTML='used <b>$'+(d.total_usage/100).toFixed(4)+'</b>';
  }catch(e){$('spend').textContent='$ ?'}
}
async function loadModels(){
  try{const d=await (await api('/models')).json();
    models=d.data.map(m=>m.id).sort();
    const list=$('modelList'); list.innerHTML='';
    for(const id of models){
      const b=document.createElement('button'); b.type='button';
      b.className='mrow'+(id===model?' sel':''); b.textContent=id;
      b.onclick=()=>{ setModel(id); modelDlg.close(); };
      list.appendChild(b);
    }
  }catch(e){err('could not load models: '+e.message)}
}
function setModel(id){
  model=id; ls('bm_model',id); $('modelBtn').textContent=id; sys('model → '+id);
  const c=cur(); if(c){c.model=id; persist();}
  [...document.querySelectorAll('.mrow')].forEach(b=>b.classList.toggle('sel',b.textContent===id));
}
$('modelBtn').onclick=()=>{if(!key)return err('set your key first: /key sk-...'); modelDlg.showModal();};
function saveKey(k){
  key=k; ls('bm_key',k); $('dot').className='dot';
  sys('key saved on this device. type a message to chat, /help for commands.');
  refreshSpend(); loadModels();
}

function xhrChat(messages){
  return new Promise((res,rej)=>{
    const x=new XMLHttpRequest();
    x.open('POST',API+'/chat/completions');
    x.setRequestHeader('Authorization','Bearer '+key);
    x.setRequestHeader('Content-Type','application/json');
    x.timeout=180000;
    x.onload=()=>{ if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText))}catch(e){rej(new Error('bad JSON from API'))}} else rej(new Error('HTTP '+x.status)); };
    x.onerror=()=>rej(new Error('network error'));
    x.ontimeout=()=>rej(new Error('timed out'));
    x.send(JSON.stringify({model,messages,stream:false}));
  });
}

/* a model that never answers must not freeze the terminal: every request
   carries an idle timeout, and the run button becomes a stop button. */
const IDLE_MS=75000;
let abortCtl=null, stoppedByUser=false;
function guard(){
  const ac=new AbortController(); let t=null;
  const arm=()=>{ clearTimeout(t); t=setTimeout(()=>{ac.reason='timeout'; ac.abort();},IDLE_MS); };
  arm();
  return {signal:ac.signal, ac, bump:arm, clear:()=>clearTimeout(t)};
}
function friendly(e){
  const m=String(e&&e.message||e);
  if(stoppedByUser) return 'stopped.';
  if(/abort|timeout|timed out|504|502|Gateway/i.test(m)){
    const alt = model==='gpt-4o' ? 'gpt-5.5' : 'gpt-4o';
    return 'no answer from "'+model+'" — that model looks down right now. try /model '+alt+' (or tap the model name up top), then send again.';
  }
  if(/401|403/.test(m)) return 'the API rejected your key. re-enter it with /key sk-...';
  if(/429/.test(m)) return 'rate limited — wait a few seconds and try again.';
  if(/insufficient|quota|balance/i.test(m)) return 'the API says your credit is exhausted.';
  return 'request failed: '+m;
}
function setBusy(on){
  busy=on; sendBtn.disabled=false;
  sendBtn.textContent=on?'stop':'run';
  sendBtn.style.background=on?'transparent':'';
  sendBtn.style.color=on?'var(--err)':'';
  sendBtn.style.border=on?'1px solid var(--line)':'';
}

async function chat(text){
  let c=cur(); if(!c) c=newChat(true);
  c.messages.push({role:'user',content:text}); touch();
  const d=line('a','ai>','');
  const cursor=document.createElement('span'); cursor.className='cursor'; d.appendChild(cursor);
  stoppedByUser=false; setBusy(true);
  const g=guard(); abortCtl=g.ac;
  let full='';
  try{
    try{
      if(!window.ReadableStream) throw new Error('no-stream');
      const r=await api('/chat/completions',{method:'POST',signal:g.signal,body:JSON.stringify({model,messages:c.messages,stream:true})});
      if(!r.body) throw new Error('no-stream');
      const reader=r.body.getReader(); const dec=new TextDecoder(); let buf='';
      while(true){
        const {done,value}=await reader.read(); if(done)break;
        g.bump();
        buf+=dec.decode(value,{stream:true});
        const lines=buf.split('\n'); buf=lines.pop();
        for(const l of lines){
          const s=l.trim(); if(!s.startsWith('data:'))continue;
          const p=s.slice(5).trim(); if(p==='[DONE]')continue;
          try{const j=JSON.parse(p); const t=j.choices?.[0]?.delta?.content;
            if(t){full+=t; cursor.before(document.createTextNode(t)); log.scrollTop=log.scrollHeight;}
          }catch(e){}
        }
      }
    }catch(se){
      if(full||stoppedByUser||g.ac.reason==='timeout') throw se; // don't pay twice
      let j=null;
      try{
        const r=await api('/chat/completions',{method:'POST',signal:g.signal,body:JSON.stringify({model,messages:c.messages,stream:false})});
        j=await r.json();
      }catch(fe){
        if(stoppedByUser||g.ac.reason==='timeout') throw fe;
        j=await xhrChat(c.messages);
      }
      full=j.choices?.[0]?.message?.content||'';
      if(!full) throw new Error('the model returned an empty answer');
      cursor.before(document.createTextNode(full)); log.scrollTop=log.scrollHeight;
    }
    c.messages.push({role:'assistant',content:full}); touch();
    refreshSpend();
  }catch(e){
    if(full){ c.messages.push({role:'assistant',content:full}); touch(); line('sys','·','(answer cut short: '+friendly(e)+')'); }
    else { c.messages.pop(); touch(); err(friendly(e)); }
  }finally{ g.clear(); abortCtl=null; cursor.remove(); setBusy(false); }
}

const HELP=[
 '/key sk-...   save your API key (stored only in this browser)',
 '/model        pick a model    /model <id> sets it directly',
 '/new          start a new chat (the current one stays saved)',
 '/chats        list saved chats    /chats <n> opens number n',
 '/rename <t>   rename this chat',
 '/delete       delete this chat',
 '/usage        show credit spent so far',
 '/clear        clear the screen (the chat stays saved)',
 '/help         this list',
 '',
 'anything else is sent to the model. chats save automatically on this',
 'device only — nobody with the link can see them.'
].join('\n');

function handle(text){
  if(text.startsWith('/')){
    const [cmd,...rest]=text.split(/\s+/); const arg=rest.join(' ');
    line('u','❯',text);
    if(cmd==='/key'&&arg) return saveKey(arg);
    if(cmd==='/help') return sys(HELP);
    if(cmd==='/clear'){ log.innerHTML=''; return sys('screen cleared — this chat is still saved (tap ☰ to reopen it).'); }
    if(cmd==='/new'){ newChat(); return; }
    if(cmd==='/chats'){
      if(arg){
        const n=parseInt(arg,10); const c=chats[n-1];
        if(!c) return err('no chat number '+arg+'. type /chats to list them.');
        curId=c.id; if(c.model){model=c.model;$('modelBtn').textContent=model;ls('bm_model',model);}
        persist(); renderChat(); return sys('opened: '+(c.title||'new chat'));
      }
      if(!chats.length) return sys('no saved chats yet.');
      return sys(chats.map((c,i)=>(i+1)+'. '+(c.id===curId?'* ':'  ')+(c.title||'new chat')+'  ('+ago(c.updated)+')').join('\n')+'\n\nopen one with /chats <number>, or tap ☰ up top.');
    }
    if(cmd==='/rename'){
      const c=cur(); if(!c) return err('no chat open.');
      if(!arg) return err('give it a name: /rename my project notes');
      c.title=arg.slice(0,60); persist(); return sys('renamed to: '+c.title);
    }
    if(cmd==='/delete'){
      const c=cur(); if(!c) return err('no chat open.');
      const t=c.title||'new chat';
      chats=chats.filter(x=>x.id!==c.id); curId=chats.length?chats[0].id:null;
      if(!curId) newChat(true); persist(); renderChat();
      return sys('deleted: '+t);
    }
    if(cmd==='/model'){
      if(!arg) return $('modelBtn').click();
      if(models.length&&!models.includes(arg)) sys('note: "'+arg+'" is not in the model list, trying anyway');
      return setModel(arg);
    }
    if(cmd==='/usage') return refreshSpend().then(()=>sys('usage refreshed (top right — of your $100 credit).'));
    return err('unknown command. /help');
  }
  if(!key){ line('u','❯',text); return err('no key set. run: /key sk-yourkeyhere'); }
  line('u','❯',text); chat(text);
}

function submit(){
  if(busy){ stoppedByUser=true; if(abortCtl) abortCtl.abort(); return; }
  const t=input.value.trim(); if(!t)return;
  input.value=''; input.style.height='auto'; handle(t);
}
sendBtn.onclick=submit;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}});
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';});

/* ---------- boot ---------- */
loadState();
$('modelBtn').textContent=model;
if(!chats.length) newChat(true);
renderChat();
if(key){
  $('dot').className='dot';
  const c=cur();
  if(c&&c.messages.length) sys('── resumed: '+(c.title||'this chat')+' · '+chats.length+' saved · tap ☰ to switch');
  else sys('blueterm — model '+model+' · '+chats.length+' saved chat'+(chats.length===1?'':'s')+' · /help for commands');
  refreshSpend(); loadModels();
}else{
  sys('blueterm — bluesminds api console');
  sys('paste your key to begin:  /key sk-yourkeyhere');
}
</script>
</body></html>
