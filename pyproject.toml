[project]
name = "luca-changesafe"
version = "0.2.0"
description = "ChangeSafe by Luca: organizational dependency intelligence and safe schema change generation powered by DataHub."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
]

[project.optional-dependencies]
datahub = ["acryl-datahub>=1.1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
